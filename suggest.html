<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suggest a track</title>
<style>
  * { box-sizing: border-box; }
  body { background: #0a0a0a; color: #fff; font-family: system-ui, sans-serif; max-width: 520px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 1.4rem; margin-bottom: 6px; }
  p.sub { opacity: 0.5; margin-bottom: 24px; font-size: 0.95rem; }
  label { display: block; margin: 16px 0 6px; font-size: 0.9rem; opacity: 0.8; }
  input, textarea { width: 100%; background: #161616; color: #fff; border: 1px solid #2c2c2c; border-radius: 8px; padding: 12px; font-size: 1rem; font-family: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  button { margin-top: 22px; width: 100%; background: #fff; color: #000; border: 0; border-radius: 8px; padding: 14px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  #msg { margin-top: 16px; text-align: center; min-height: 1.4em; }
  .ok { color: #6ee7a0; } .err { color: #ff8a8a; }
</style>
</head>
<body>
  <h1>Suggest a track</h1>
  <p class="sub">Paste a YouTube video or playlist link. It'll be reviewed before it goes into rotation.</p>

  <label for="url">YouTube link</label>
  <input id="url" placeholder="https://youtube.com/watch?v=… or a playlist link">

  <label for="name">Label (optional)</label>
  <input id="name" placeholder="e.g. Lo-fi mix">

  <label for="note">Note to the curator (optional)</label>
  <textarea id="note" placeholder="Anything you want to add"></textarea>

  <button id="send">Submit suggestion</button>
  <div id="msg"></div>

<script>
  const msg = document.getElementById("msg");
  document.getElementById("send").addEventListener("click", async () => {
    const url = document.getElementById("url").value.trim();
    if (!url) { msg.textContent = "Add a link first."; msg.className = "err"; return; }
    msg.textContent = "Sending…"; msg.className = "";
    try {
      const r = await fetch("/api/suggest", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({
          url,
          name: document.getElementById("name").value,
          note: document.getElementById("note").value,
        }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Something went wrong.");
      msg.textContent = d.duplicate ? "Already suggested — thanks!" : "Thanks! Suggestion received.";
      msg.className = "ok";
      document.getElementById("url").value = "";
      document.getElementById("name").value = "";
      document.getElementById("note").value = "";
    } catch (e) {
      msg.textContent = e.message; msg.className = "err";
    }
  });
</script>
</body>
</html>
