<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<style>
  * { box-sizing: border-box; }
  body { background: #0a0a0a; color: #fff; font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 1.3rem; } h2 { font-size: 1rem; margin: 28px 0 10px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.08em; }
  input, button { font-family: inherit; font-size: 0.95rem; }
  .row { display: flex; gap: 8px; align-items: center; background: #141414; border: 1px solid #262626; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .row .main { flex: 1; min-width: 0; }
  .row .main b { display: block; }
  .row .main small { opacity: 0.5; word-break: break-all; }
  .tag { font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; background: #262626; }
  button.act { background: #1f1f1f; color: #fff; border: 1px solid #333; border-radius: 8px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
  button.ok { border-color: #2f6b45; } button.ok:hover { background: #17351f; }
  button.no { border-color: #6b2f2f; } button.no:hover { background: #351717; }
  input { background: #161616; color: #fff; border: 1px solid #2c2c2c; border-radius: 8px; padding: 10px; }
  #gate { max-width: 340px; margin: 80px auto; text-align: center; }
  #gate input { width: 100%; margin: 12px 0; }
  #gate button { width: 100%; background: #fff; color: #000; border: 0; border-radius: 8px; padding: 12px; font-weight: 600; cursor: pointer; }
  #add { display: flex; gap: 8px; margin-bottom: 8px; }
  #add input { flex: 1; }
  .empty { opacity: 0.4; padding: 8px 0; }
  a.linkout { color: #7db9ff; font-size: 0.8rem; }
  .grip { cursor: grab; opacity: 0.4; padding: 0 4px; user-select: none; font-size: 1.1rem; }
  .row.dragging { opacity: 0.4; }
  .row.over { border-color: #4a7bb5; }
  .hint { opacity: 0.35; font-size: 0.8rem; margin-bottom: 8px; }
</style>
</head>
<body>
  <div id="gate">
    <h1>Admin</h1>
    <input id="pw" type="password" placeholder="Password">
    <button id="enter">Enter</button>
    <div id="gerr" style="color:#ff8a8a;margin-top:8px;min-height:1.2em"></div>
  </div>

  <div id="app" style="display:none">
    <h1>Admin</h1>

    <h2>Add directly to rotation</h2>
    <div id="add">
      <input id="addurl" placeholder="YouTube video or playlist link">
      <input id="addname" placeholder="Label (optional)" style="max-width:180px">
      <button class="act ok" id="addbtn">Add</button>
    </div>

    <h2>Pending suggestions</h2>
    <div id="suggestions"></div>

    <h2>Active rotation</h2>
    <div class="hint">Drag the ⠿ handle to reorder. Order is saved automatically.</div>
    <div id="active"></div>
  </div>

<script>
  let PW = sessionStorage.getItem("pw") || "";

  const H = () => ({ "content-type": "application/json", "authorization": "Bearer " + PW });
  const ytLink = (it) => it.type === "playlist"
    ? `https://youtube.com/playlist?list=${it.id}`
    : `https://youtube.com/watch?v=${it.id}`;

  async function loadAll() {
    const [sres, ares] = await Promise.all([
      fetch("/api/suggestions", { headers: H() }),
      fetch("/api/list"),
    ]);
    if (sres.status === 401) { logout(); return; }
    const s = await sres.json();
    const a = await ares.json();
    renderSuggestions(s.items || []);
    renderActive(a.items || []);
  }

  function renderSuggestions(list) {
    const el = document.getElementById("suggestions");
    if (!list.length) { el.innerHTML = '<div class="empty">Nothing pending.</div>'; return; }
    el.innerHTML = "";
    for (const it of list) {
      const div = document.createElement("div");
      div.className = "row";
      div.innerHTML = `
        <span class="tag">${it.type}</span>
        <div class="main">
          <b>${it.name || "(no label)"}</b>
          <small>${it.note ? it.note + " · " : ""}<a class="linkout" target="_blank" href="${ytLink(it)}">${ytLink(it)}</a></small>
        </div>
        <button class="act ok">Approve</button>
        <button class="act no">Reject</button>`;
      div.querySelector(".ok").onclick = async () => { await post("/api/approve", { key: it.key }); loadAll(); };
      div.querySelector(".no").onclick = async () => { await post("/api/manage", { action: "reject", key: it.key }); loadAll(); };
      el.appendChild(div);
    }
  }

  let dragKey = null;

  function renderActive(list) {
    const el = document.getElementById("active");
    if (!list.length) { el.innerHTML = '<div class="empty">Rotation is empty.</div>'; return; }
    el.innerHTML = "";
    for (const it of list) {
      const div = document.createElement("div");
      div.className = "row";
      div.draggable = true;
      div.dataset.key = it.key;
      div.innerHTML = `
        <span class="grip" title="Drag to reorder">⠿</span>
        <span class="tag">${it.type}</span>
        <div class="main">
          <b>${it.name || "(no label)"}</b>
          <small><a class="linkout" target="_blank" href="${ytLink(it)}">${ytLink(it)}</a></small>
        </div>
        <button class="act no">Remove</button>`;
      div.querySelector(".no").onclick = async () => { await post("/api/manage", { action: "remove", key: it.key }); loadAll(); };

      div.addEventListener("dragstart", () => { dragKey = it.key; div.classList.add("dragging"); });
      div.addEventListener("dragend", () => { div.classList.remove("dragging"); saveOrder(); });
      div.addEventListener("dragover", (e) => {
        e.preventDefault();
        const dragging = el.querySelector(".dragging");
        if (!dragging || dragging === div) return;
        const rect = div.getBoundingClientRect();
        const after = e.clientY > rect.top + rect.height / 2;
        el.insertBefore(dragging, after ? div.nextSibling : div);
      });
      el.appendChild(div);
    }
  }

  async function saveOrder() {
    const keys = [...document.querySelectorAll("#active .row")].map(r => r.dataset.key);
    if (keys.length) await post("/api/manage", { action: "reorder", keys });
  }

  async function post(url, body) {
    const r = await fetch(url, { method: "POST", headers: H(), body: JSON.stringify(body) });
    if (r.status === 401) { logout(); }
    return r.json();
  }

  document.getElementById("addbtn").onclick = async () => {
    const url = document.getElementById("addurl").value.trim();
    if (!url) return;
    const d = await post("/api/manage", { action: "add", url, name: document.getElementById("addname").value });
    if (d.error) { alert(d.error); return; }
    document.getElementById("addurl").value = "";
    document.getElementById("addname").value = "";
    loadAll();
  };

  function login() {
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadAll();
  }
  function logout() {
    sessionStorage.removeItem("pw"); PW = "";
    document.getElementById("gate").style.display = "block";
    document.getElementById("app").style.display = "none";
    document.getElementById("gerr").textContent = "Wrong password.";
  }

  document.getElementById("enter").onclick = async () => {
    PW = document.getElementById("pw").value;
    const r = await fetch("/api/suggestions", { headers: H() });
    if (r.ok) { sessionStorage.setItem("pw", PW); login(); }
    else { document.getElementById("gerr").textContent = "Wrong password."; }
  };
  document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("enter").click(); });

  if (PW) { fetch("/api/suggestions", { headers: H() }).then(r => r.ok ? login() : sessionStorage.removeItem("pw")); }
</script>
</body>
</html>
