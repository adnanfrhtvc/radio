<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hidrocibalae — House Radio</title>
<link rel="stylesheet" href="/css/index.css">
</head>
<body>
  <div id="hidden-player"><div id="player"></div></div>
  <div class="stage">
    <div class="deck">
      <div class="platter">
        <div class="vinyl" id="vinyl">
          <div class="label">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Hidrocibalae">
              <circle cx="32" cy="32" r="30" fill="#3aa8a0"/>
              <path d="M14 24 C24 18, 40 18, 50 24" stroke="#f2f8f7" stroke-width="4.5" fill="none" stroke-linecap="round"/>
              <path d="M13 34 C24 40, 40 40, 51 34" stroke="#f2f8f7" stroke-width="4.5" fill="none" stroke-linecap="round"/>
              <path d="M22 15 C18 28, 18 40, 26 51" stroke="#f2f8f7" stroke-width="4.5" fill="none" stroke-linecap="round"/>
              <path d="M42 13 C48 26, 46 40, 40 50" stroke="#f2f8f7" stroke-width="4.5" fill="none" stroke-linecap="round"/>
            </svg>
            <div class="brand">HIDROCIBALAE</div>
          </div>
          <div class="spindle"></div>
        </div>
        <div class="tonearm off" id="tonearm">
          <div class="pivot"></div><div class="arm"></div><div class="head"></div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="onair"><span class="dot"></span> ON AIR</div>
      <div class="station">Hidrocibalae</div>
      <div class="subtitle">HOUSE RADIO &nbsp;|&nbsp; <b>24 / 7</b></div>
      <div class="eq" id="eq"></div>
      <div class="nowtitle" id="nowtitle">Press play to tune in.</div>
      <div class="controls">
        <button class="play" id="play" title="Play / Pause">▶</button>
        <button id="resync" title="Re-sync to live">⟳ LIVE</button>
        <div class="vol">
          <button id="mute" title="Mute">🔊</button>
          <input id="vol" type="range" min="0" max="100" value="70">
        </div>
      </div>
      <div class="footer">33 ⅓ RPM · STEREO &nbsp;·&nbsp; <a href="#" id="openSuggest">SUGGEST A TRACK →</a></div>
    </div>
  </div>
  <div class="start-overlay" id="overlay"><div class="btn">▶ &nbsp;TUNE IN</div></div>

  <!-- Suggest-a-track modal (music keeps playing underneath) -->
  <div class="modal-backdrop" id="suggestModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="suggestTitle">
      <button class="modal-close" id="suggestClose" aria-label="Close">×</button>
      <h2 id="suggestTitle">Suggest a track</h2>
      <p class="modal-sub">Paste a YouTube video or playlist link. Preview what gets added, then send it in for review.</p>

      <label for="s-url">YouTube link</label>
      <input id="s-url" placeholder="https://youtube.com/watch?v=… or a playlist link" autocomplete="off">

      <div id="s-preview" class="preview" hidden>
        <div class="preview-head" id="s-preview-head"></div>
        <div class="preview-list" id="s-preview-list"></div>
      </div>

      <label for="s-name">Label (optional)</label>
      <input id="s-name" placeholder="e.g. Lo-fi mix" autocomplete="off">

      <label for="s-note">Note to the curator (optional)</label>
      <textarea id="s-note" placeholder="Anything you want to add"></textarea>

      <button id="s-send" class="modal-send">Submit suggestion</button>
      <div id="s-msg" class="modal-msg"></div>
    </div>
  </div>
<script type="module" src="/js/index.js"></script>
</body>
</html>
