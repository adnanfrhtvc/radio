<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hidrocibalae — House Radio</title>
<style>
  :root {
    --bg1: #0a0e10;
    --bg2: #050e11;
    --teal: #56c3bb;
    --teal-dim: #2f7d78;
    --label: #dbeeea;
    --ink: #eaf3f2;
    --muted: #7b9490;
    --vinyl: #131719;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 120% at 30% 40%, var(--bg1) 0%, var(--bg2) 70%, #030809 100%);
    color: var(--ink);
    font-family: "Helvetica Neue", Arial, system-ui, sans-serif;
    overflow: hidden;
  }
  #hidden-player { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; left: -9999px; }
  .stage { height: 100%; display: grid; grid-template-columns: 1.05fr 0.95fr; align-items: center; gap: 2vw; padding: 5vh 6vw; max-width: 1240px; margin: 0 auto; }
  .deck { position: relative; display: flex; align-items: center; justify-content: center; }
  .platter { position: relative; width: min(46vh, 30vw); aspect-ratio: 1; }
  .vinyl { position: absolute; inset: 0; border-radius: 50%; background: repeating-radial-gradient(circle at 50% 50%, #0c0f10 0px, #0c0f10 1px, #15191b 2px, #0c0f10 3px); box-shadow: 0 30px 80px rgba(0,0,0,0.7), inset 0 0 60px rgba(0,0,0,0.9); animation: spin 4s linear infinite; animation-play-state: paused; }
  .vinyl::before { content: ""; position: absolute; inset: 8%; border-radius: 50%; background: repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 2px, transparent 5px); }
  .vinyl.playing { animation-play-state: running; }
  .label { position: absolute; inset: 34%; border-radius: 50%; background: radial-gradient(circle at 42% 38%, #ffffff 0%, var(--label) 55%, #c4dcd8 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: inset 0 0 18px rgba(0,0,0,0.15); }
  .label svg { width: 40%; height: 40%; }
  .label .brand { font-size: clamp(5px, 1.1vw, 9px); letter-spacing: 0.28em; color: var(--teal-dim); margin-top: 8%; padding-left: 0.28em; font-weight: 600; }
  .spindle { position: absolute; top: 50%; left: 50%; width: 2.5%; aspect-ratio: 1; background: #0a0d0e; border-radius: 50%; transform: translate(-50%,-50%); box-shadow: 0 0 4px rgba(0,0,0,0.8); }
  .tonearm { position: absolute; top: 6%; right: -6%; width: 44%; height: 44%; transform-origin: 88% 12%; transform: rotate(14deg); transition: transform 0.8s ease; pointer-events: none; }
  .tonearm.off { transform: rotate(-8deg); }
  .tonearm .pivot { position: absolute; top: 4%; right: 6%; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #3a4144, #14181a); box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
  .tonearm .arm { position: absolute; top: 14%; right: 15%; width: 4px; height: 78%; background: linear-gradient(#4a5457, #2a3033); transform-origin: top center; transform: rotate(28deg); border-radius: 3px; }
  .tonearm .head { position: absolute; bottom: 6%; left: 34%; width: 16px; height: 26px; border-radius: 3px; background-color: #20262a; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
  .panel { padding-right: 2vw; }
  .onair { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.32em; color: var(--teal); font-weight: 600; margin-bottom: 14px; }
  .onair .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 10px var(--teal); animation: pulse 2s ease-in-out infinite; }
  .station { font-size: clamp(34px, 5.2vw, 60px); font-weight: 700; letter-spacing: -0.01em; line-height: 1; }
  .subtitle { margin-top: 12px; font-size: clamp(12px, 1.4vw, 15px); letter-spacing: 0.22em; color: var(--muted); font-weight: 600; }
  .subtitle b { color: var(--ink); font-weight: 700; }
  .eq { display: flex; align-items: flex-end; gap: 3px; height: 64px; margin: 30px 0 14px; }
  .eq span { width: 4px; background: linear-gradient(var(--teal), var(--teal-dim)); height: 8%; border-radius: 2px; transition: height 0.12s ease; }
  .nowtitle { font-size: clamp(13px, 1.5vw, 16px); color: var(--muted); letter-spacing: 0.05em; min-height: 1.4em; max-width: 42ch; }
  .nowtitle b { color: var(--ink); font-weight: 600; }
  .controls { display: flex; align-items: center; gap: 14px; margin-top: 26px; }
  .controls button { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); color: var(--ink); width: 44px; height: 44px; border-radius: 50%; font-size: 15px; cursor: pointer; display: grid; place-items: center; transition: background 0.2s, border-color 0.2s; }
  .controls button:hover { background: rgba(86,195,187,0.14); border-color: var(--teal-dim); }
  .controls .play { width: 54px; height: 54px; background: var(--teal); border-color: var(--teal); color: #04110f; font-size: 18px; }
  .controls .play:hover { background: #6ad2ca; }
  .controls #resync { width: auto; padding: 0 16px; border-radius: 22px; font-size: 11px; letter-spacing: 0.18em; color: var(--teal); gap: 6px; }
  .controls #mute { width: 38px; height: 38px; font-size: 13px; }
  .vol { display: flex; align-items: center; gap: 8px; margin-left: 6px; }
  .vol input { width: 110px; accent-color: var(--teal); }
  .footer { margin-top: 34px; font-size: 11px; letter-spacing: 0.28em; color: var(--muted); }
  .footer a { color: var(--teal-dim); text-decoration: none; border-bottom: 1px solid transparent; }
  .footer a:hover { border-color: var(--teal-dim); }
  .start-overlay { position: fixed; inset: 0; background: rgba(3,8,9,0.86); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 10; cursor: pointer; }
  .start-overlay .btn { display: flex; align-items: center; gap: 12px; font-size: 15px; letter-spacing: 0.3em; color: var(--teal); font-weight: 600; border: 1px solid var(--teal-dim); border-radius: 999px; padding: 16px 34px; }
  .start-overlay .btn:hover { background: rgba(86,195,187,0.1); }
  .hidden { display: none !important; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (max-width: 820px) {
    body { overflow: auto; }
    .stage {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto;
      align-content: start;
      gap: 4vh;
      padding: 6vh 7vw 8vh;
      min-height: 100%;
    }
    .deck { padding-top: 2vh; }
    .platter { width: min(74vw, 340px); }
    /* Tonearm is decorative on the big desktop deck; hide on narrow screens
       where it would clip the record. */
    .tonearm { display: none; }
    .panel { padding-right: 0; }
    .station { font-size: clamp(40px, 12vw, 60px); }
    .eq { height: 54px; margin: 24px 0 12px; }
    .controls { flex-wrap: wrap; gap: 12px; }
    .vol { margin-left: 0; }
    .vol input { width: 46vw; max-width: 200px; }
    .footer { margin-top: 26px; line-height: 1.8; }
  }
  @media (max-width: 400px) {
    .controls .play { width: 60px; height: 60px; }
    .controls button { width: 48px; height: 48px; }
    .controls #resync { height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) { .vinyl, .vinyl.playing { animation: none; } }
</style>
</head>
<body>
  <div id="hidden-player"><div id="player"></div></div>
  <div class="stage">
    <div class="deck">
      <div class="platter">
        <div class="vinyl" id="vinyl">
          <div class="label">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Hidrocibalae">
              <circle cx="32" cy="32" r="30" fill="#3aa8a0"/>
              <path d="M14 24 C24 18, 40 18, 50 24" stroke="#f2f8f7" stroke-width="4.5" fill="none" stroke-linecap="round"/>
              <path d="M13 34 C24 40, 40 40, 51 34" stroke="#f2f8f7" stroke-width="4.5" fill="none" stroke-linecap="round"/>
              <path d="M22 15 C18 28, 18 40, 26 51" stroke="#f2f8f7" stroke-width="4.5" fill="none" stroke-linecap="round"/>
              <path d="M42 13 C48 26, 46 40, 40 50" stroke="#f2f8f7" stroke-width="4.5" fill="none" stroke-linecap="round"/>
            </svg>
            <div class="brand">HIDROCIBALAE</div>
          </div>
          <div class="spindle"></div>
        </div>
        <div class="tonearm off" id="tonearm">
          <div class="pivot"></div><div class="arm"></div><div class="head"></div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="onair"><span class="dot"></span> ON AIR</div>
      <div class="station">Hidrocibalae</div>
      <div class="subtitle">HOUSE RADIO &nbsp;|&nbsp; <b>24 / 7</b></div>
      <div class="eq" id="eq"></div>
      <div class="nowtitle" id="nowtitle">Press play to tune in.</div>
      <div class="controls">
        <button class="play" id="play" title="Play / Pause">▶</button>
        <button id="resync" title="Re-sync to live">⟳ LIVE</button>
        <div class="vol">
          <button id="mute" title="Mute">🔊</button>
          <input id="vol" type="range" min="0" max="100" value="70">
        </div>
      </div>
      <div class="footer">33 ⅓ RPM · STEREO &nbsp;·&nbsp; <a href="/suggest">SUGGEST A TRACK →</a></div>
    </div>
  </div>
  <div class="start-overlay" id="overlay"><div class="btn">▶ &nbsp;TUNE IN</div></div>
<script>
  let player, items = [], idx = 0, ready = false, playing = false;
  let lastLoadAt = 0, loadedIndex = -1, userPaused = false;
  const STARTUP_GRACE_MS = 6000;
  const eq = document.getElementById("eq");
  const BAR_COUNT = 28; const bars = []; const phases = [];
  for (let i = 0; i < BAR_COUNT; i++) { const s = document.createElement("span"); eq.appendChild(s); bars.push(s); phases.push(Math.random() * Math.PI * 2); }
  let t = 0;
  function animateEq() {
    t += 0.08;
    const vol = player && ready ? (player.getVolume ? player.getVolume() / 100 : 0.7) : 0.7;
    for (let i = 0; i < BAR_COUNT; i++) {
      let h;
      if (playing) {
        const base = Math.sin(t * (0.7 + i % 5 * 0.12) + phases[i]);
        const flick = Math.sin(t * 2.3 + i) * 0.4;
        h = (0.5 + 0.5 * base) * (0.6 + 0.4 * flick);
        h = Math.max(0.08, Math.min(1, h)) * (0.35 + 0.65 * vol);
      } else { h = 0.06; }
      bars[i].style.height = (h * 100) + "%";
    }
    requestAnimationFrame(animateEq);
  }
  animateEq();
  // ---- Synced radio engine ----
  // The backend gives us the full track timeline + its own clock. We compute
  // the shared position as (now - epoch) mod total, so every listener lands on
  // the same track at the same offset. clockSkew corrects our local clock.
  let timeline = { items: [], total: 0, epoch: 0 };
  let clockSkew = 0; // serverNow - localNow (seconds)

  async function fetchList() {
    try {
      const r = await fetch("/api/list");
      const d = await r.json();
      timeline = { items: d.items || [], total: d.total || 0, epoch: d.epoch || 0 };
      items = timeline.items;
      if (typeof d.serverNow === "number") clockSkew = d.serverNow - (Date.now() / 1000);
    } catch { items = []; timeline = { items: [], total: 0, epoch: 0 }; }
  }

  function serverSeconds() { return (Date.now() / 1000) + clockSkew; }

  // Where should the station be right now? Returns { index, offset } or null.
  function livePosition() {
    if (!timeline.items.length || timeline.total <= 0) return null;
    let pos = (serverSeconds() - timeline.epoch) % timeline.total;
    if (pos < 0) pos += timeline.total;
    for (let i = 0; i < timeline.items.length; i++) {
      const dur = timeline.items[i].seconds || 0;
      if (pos < dur) return { index: i, offset: pos };
      pos -= dur;
    }
    return { index: timeline.items.length - 1, offset: 0 };
  }

  const tag = document.createElement("script"); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player("player", { height: "120", width: "200", playerVars: { autoplay: 0, controls: 0, rel: 0 }, events: { onReady: () => { ready = true; }, onStateChange } });
  };

  // Load whatever is live now and seek into it.
  function goLive() {
    const p = livePosition();
    if (!p || !ready) return;
    idx = p.index;
    loadedIndex = p.index;
    lastLoadAt = Date.now();
    const it = timeline.items[idx];
    player.loadVideoById({ videoId: it.id, startSeconds: Math.floor(p.offset) });
    setTimeout(updateTitle, 900);
  }

  // Drift correction: nudge playback back toward the shared position.
  // Mobile players start slowly, so we (1) never touch a track that was just
  // loaded (grace window), (2) prefer seekTo over a full reload, and (3) only
  // reload when the live track is genuinely different AND we're past startup.
  // This stops the "plays a split second then pauses" reload loop on Android.
  function driftCheck() {
    if (!ready || !playing) return;
    // Give a freshly loaded track time to actually begin before judging drift.
    if (Date.now() - lastLoadAt < STARTUP_GRACE_MS) return;
    const p = livePosition();
    if (!p) return;
    // The live track has rolled over to a different song — reload to catch it.
    if (p.index !== loadedIndex) { goLive(); return; }
    // Same track, just correct position without reloading.
    try {
      const local = player.getCurrentTime();
      if (Math.abs(local - p.offset) > 6) player.seekTo(p.offset, true);
    } catch {}
  }
  setInterval(driftCheck, 5000);

  function setPlaying(on) {
    playing = on;
    document.getElementById("vinyl").classList.toggle("playing", on);
    document.getElementById("tonearm").classList.toggle("off", !on);
    document.getElementById("play").textContent = on ? "\u275a\u275a" : "\u25b6";
  }

  function onStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING) { setPlaying(true); updateTitle(); }
    else if (e.data === YT.PlayerState.PAUSED) {
      // Mobile browsers (incl. Vivaldi Android) often fire a transient PAUSED
      // right after a video loads. If the user didn't press pause and we're
      // still in the startup window, resume automatically instead of stopping.
      if (!userPaused && Date.now() - lastLoadAt < STARTUP_GRACE_MS) {
        try { player.playVideo(); } catch {}
        return;
      }
      setPlaying(false);
    }
    else if (e.data === YT.PlayerState.ENDED) { goLive(); } // next track = whatever's live
  }

  function updateTitle() {
    try {
      const d = player.getVideoData();
      if (d && d.title) document.getElementById("nowtitle").innerHTML = "<b>" + d.title + "</b>";
    } catch {}
  }
  setInterval(() => { if (ready && playing) updateTitle(); }, 3000);

  // Controls
  document.getElementById("play").onclick = () => {
    if (!ready) return;
    if (playing) { userPaused = true; player.pauseVideo(); }
    else { userPaused = false; goLive(); } // resuming rejoins the live position, not where you paused
  };
  document.getElementById("resync").onclick = async () => { userPaused = false; await fetchList(); goLive(); };
  document.getElementById("vol").oninput = (e) => { if (player) { player.unMute(); player.setVolume(+e.target.value); } };
  document.getElementById("mute").onclick = () => {
    if (!player) return;
    const b = document.getElementById("mute");
    if (player.isMuted()) { player.unMute(); b.textContent = "\ud83d\udd0a"; }
    else { player.mute(); b.textContent = "\ud83d\udd07"; }
  };

  document.getElementById("overlay").onclick = async () => {
    await fetchList();
    if (!items.length) { document.getElementById("nowtitle").textContent = "Nothing in rotation yet \u2014 add something in admin."; }
    document.getElementById("overlay").classList.add("hidden");
    if (ready && items.length) { userPaused = false; player.setVolume(+document.getElementById("vol").value); goLive(); }
  };
</script>
</body>
</html>
