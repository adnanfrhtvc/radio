# Netlify configuration.
# Static assets are served from public/; serverless functions live under
# netlify/functions/ and are exposed at /api/* via each function's config.path.

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Pretty URL: /admin resolves to its .html file.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# The standalone suggest page became a modal on the player; keep old shared
# links working by opening the modal instead.
[[redirects]]
  from = "/suggest"
  to = "/#suggest"
  status = 301
